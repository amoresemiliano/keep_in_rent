<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madrid Rental Manager - Dev Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="setup-modal" class="modal hidden">
        <div class="modal-content">
            <h3>📍 Configuración del Piso</h3>
            <form id="setup-form">
                <input type="text" name="direccion" placeholder="Ej: Calle Mayor 1" required>
                <input type="text" name="cp" placeholder="Código Postal" required>
                <button type="submit" class="btn-primary">Empezar</button>
            </form>
        </div>
    </div>

    <header class="main-header">
        <div class="header-info">
            <h1>Madrid <span class="text-light">Rental</span></h1>
            <small id="display-address"></small>
        </div>
        <nav id="main-nav">
            <button class="nav-btn active" data-target="view-dashboard">Resumen</button>
            <button class="nav-btn" data-target="view-bookings">Reservas</button>
            <button class="nav-btn" data-target="view-expenses">Gastos</button>
            <button class="nav-btn" data-target="view-market">Mercado</button>
        </nav>
    </header>

    <main id="app-container">
        <section id="view-dashboard" class="app-view active">
            <h2>Dashboard</h2>
            <div class="card-grid">
                <div class="card"><h3>Ingresos Brutos</h3><p id="dash-bruto">0€</p></div>
                <div class="card"><h3>Gastos Totales</h3><p id="dash-gastos">0€</p></div>
                <div class="card"><h3>Neto Real</h3><p id="dash-neto">0€</p></div>
            </div>
            <button id="clear-data" class="btn-danger">Resetear Todo (Borrar Memoria)</button>
        </section>

        <section id="view-bookings" class="app-view">
            <h2>Carga de Reservas</h2>
            <form id="form-booking" class="data-form">
                <select name="platform" required>
                    <option value="Airbnb">Airbnb</option>
                    <option value="Booking">Booking</option>
                </select>
                <input type="date" name="checkin" required>
                <input type="number" name="bruto" placeholder="Precio Bruto Cobrado" step="0.01" required>
                <input type="number" name="limpieza" placeholder="Gasto Limpieza" step="0.01">
                <button type="submit" class="btn-primary">Registrar Reserva</button>
            </form>
            <div class="list-container">
                <h3>Últimas Reservas</h3>
                <ul id="list-bookings"></ul>
            </div>
        </section>

        <section id="view-expenses" class="app-view">
            <h2>Gastos del Piso</h2>
            <form id="form-expense" class="data-form">
                <select name="category" required>
                    <option value="Internet">Internet</option>
                    <option value="Luz">Electricidad</option>
                    <option value="Gas">Gas</option>
                    <option value="Comunidad">Comunidad</option>
                    <option value="Hacienda">Tasas / Hacienda</option>
                </select>
                <input type="number" name="amount" placeholder="Monto €" step="0.01" required>
                <button type="submit" class="btn-primary">Añadir Gasto</button>
            </form>
            <div class="list-container">
                <h3>Desglose de Gastos</h3>
                <ul id="list-expenses"></ul>
            </div>
        </section>

        <section id="view-market" class="app-view">
            <h2>Análisis de Mercado</h2>
            <p>Aquí se integrará el scraping e IA en la siguiente etapa.</p>
        </section>
    </main>

    <script src="app.js" type="module"></script>
</body>
</html>
