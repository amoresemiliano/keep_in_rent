<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rental Analytics - BI Modular</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div id="setup-modal" class="modal hidden">
        <div class="modal-content">
            <h3>📍 Identificación del Activo</h3>
            <form id="setup-form">
                <input type="text" name="direccion" id="input-dir" placeholder="Dirección exacta" required>
                <input type="text" name="cp" id="input-cp" placeholder="Código Postal" required>
                <button type="submit" class="btn-primary">Acceder</button>
            </form>
        </div>
    </div>

    <div id="import-modal" class="modal hidden">
        <div class="modal-content">
            <h3><i class="fa fa-file-import"></i> Importar Datos Históricos</h3>
            <div style="display: grid; gap: 15px; margin-top:15px;">
                <div class="field">
                    <label>Reservas (CSV Airbnb/Booking):</label>
                    <input type="file" id="csv-bookings" accept=".csv">
                </div>
                <div class="field">
                    <label>Gastos (CSV):</label>
                    <input type="file" id="csv-expenses" accept=".csv">
                </div>
            </div>
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button id="btn-do-import" class="btn-primary" style="flex:1">Procesar archivos</button>
                <button id="btn-close-import" class="btn-secondary">Cerrar</button>
            </div>
        </div>
    </div>

    <header class="main-header">
        <div class="header-info">
            <h1>Rental <span class="text-accent">Analytics</span></h1>
            <span id="display-address" style="cursor: pointer;">Cargando activo...</span>
        </div>
        <nav class="main-nav">
            <button class="nav-btn active" data-target="view-dashboard">Resumen</button>
            <button class="nav-btn" data-target="view-bookings">Reservas</button>
            <button class="nav-btn" data-target="view-expenses">Gastos</button>
            <button class="nav-btn" data-target="view-analysis">Análisis</button>
            <button class="nav-btn" data-target="view-bank">Banco</button>
            <button class="nav-btn" data-target="view-market">Mercado</button>
        </nav>
    </header>

    <main class="container">
        <section id="view-dashboard" class="app-view active">
            <div class="card-grid">
                <div class="card card-bruto"><h3>Bruto</h3><p id="dash-bruto">0.00€</p></div>
                <div class="card card-gestion"><h3>Gestión</h3><p id="dash-gestion">0.00€</p></div>
                <div class="card card-propiedad"><h3>Propiedad</h3><p id="dash-propiedad">0.00€</p></div>
                <div class="card card-neto"><h3>Neto</h3><p id="dash-neto">0.00€</p></div>
            </div>
            <div class="chart-container"><canvas id="mainTimelineChart"></canvas></div>
            <div style="text-align: center; margin-top: 20px;">
                <button id="open-import-btn" class="btn-secondary" style="font-size: 0.75rem;">
                    <i class="fa fa-file-import"></i> Cargar datos históricos (CSV)
                </button>
            </div>
        </section>

        <section id="view-bookings" class="app-view">
            <form id="form-booking" class="card">
                <input type="hidden" name="booking_id">
                <div class="form-grid">
                    <div class="field"><label>Check-in</label><input type="date" name="checkin" required></div>
                    <div class="field"><label>Check-out</label><input type="date" name="checkout" required></div>
                    <div class="field"><label>Bruto (€)</label><input type="number" step="0.01" name="bruto" required></div>
                    <div class="field"><label>Fee Banco</label><input type="number" step="0.01" name="fee_banco"></div>
                    <div class="field"><label>Fee Plataforma</label><input type="number" step="0.01" name="fee_thl"></div>
                    <div class="field"><label>Limpieza</label><input type="number" step="0.01" name="limpieza"></div>
                    <div class="field"><label>Plataforma</label>
                        <select name="platform"><option>Airbnb</option><option>Booking</option><option>Directa</option></select>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Guardar Reserva</button>
            </form>
            <table class="data-table">
                <thead><tr><th>Fecha</th><th>Plataforma</th><th>Bruto</th><th>Neto</th><th>Acciones</th></tr></thead>
                <tbody id="list-bookings-body"></tbody>
            </table>
        </section>

        <section id="view-expenses" class="app-view">
            <form id="form-expense" class="card">
                <div class="form-grid">
                    <div class="field"><label>Fecha</label><input type="date" name="date" required></div>
                    <div class="field"><label>Categoría</label><input type="text" name="category" required></div>
                    <div class="field"><label>Importe (€)</label><input type="number" step="0.01" name="amount" required></div>
                </div>
                <button type="submit" class="btn-primary">Guardar Gasto</button>
            </form>
            <table class="data-table">
                <thead><tr><th>Fecha</th><th>Categoría</th><th>Importe</th><th>Acciones</th></tr></thead>
                <tbody id="list-expenses-body"></tbody>
            </table>
        </section>

        <section id="view-analysis" class="app-view">
            <table class="data-table">
                <thead><tr><th>Mes</th><th>Noches</th><th>Bruto</th><th>Neto</th></tr></thead>
                <tbody id="cross-analysis-body"></tbody>
            </table>
        </section>
        
        <section id="view-bank" class="app-view">
            <table class="data-table">
                <thead><tr><th>Ref</th><th>Esperado</th><th>Recibido</th><th>Dif.</th><th>Obs.</th></tr></thead>
                <tbody id="bank-list-body"></tbody>
            </table>
        </section>

        <section id="view-market" class="app-view">
            <div id="market-cards-container" class="card-grid"></div>
            <p id="market-status-box" style="text-align:center; margin-top:20px;"></p>
        </section>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
